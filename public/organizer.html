<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - EventHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo">EventHub</a>

    <div id="navLinks"></div>
</nav>

<main class="container">

    <section class="hero small">
        <h1>Organizer Dashboard</h1>
        <p>Create and manage your events.</p>
    </section>

    <div id="message"></div>

    <section class="card">

        <h2>Create Event</h2>

        <form id="createEventForm" class="form-grid">

            <div>
                <label>Title</label>
                <input id="title" required>
            </div>

            <div>
                <label>Location</label>
                <input id="location" required>
            </div>

            <div>
                <label>Date & Time</label>
                <input
                    type="datetime-local"
                    id="event_date"
                    required
                >
            </div>

            <div>
                <label>Capacity</label>
                <input
                    type="number"
                    id="capacity"
                    min="1"
                    required
                >
            </div>

            <div class="full-width">
                <label>Description</label>
                <textarea id="description"></textarea>
            </div>

            <button type="submit" class="primary">
                Create Event
            </button>

        </form>

    </section>

    <section>

        <div class="section-header">
            <h2>My Events</h2>
            <button onclick="loadMyEvents()">Refresh</button>
        </div>

        <div id="myEvents" class="event-grid"></div>

    </section>

</main>

<script src="/js/common.js"></script>
<script src="/js/organizer.js"></script>

</body>
</html>
