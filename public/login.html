<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo">EventHub</a>
</nav>

<main class="auth-container">

    <div class="card">

        <h1>Login</h1>
        <p class="muted">Sign in to manage your events and registrations.</p>

        <div id="message"></div>

        <form id="loginForm">

            <label>Email</label>
            <input
                type="email"
                id="email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                required
            >

            <button type="submit" class="primary full">
                Login
            </button>

        </form>

        <p class="form-footer">
            Don't have an account?
            <a href="/register.html">Create one</a>
        </p>

    </div>

</main>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
